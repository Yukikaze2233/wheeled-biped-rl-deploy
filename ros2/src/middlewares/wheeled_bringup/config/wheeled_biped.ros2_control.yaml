# ros2_control configuration for the wheeled biped (CONTRACT.md).
#
# Controller manager runs at 500 Hz (one MuJoCo step per cycle, timestep
# 0.002 s). Legs use position commands (firmware closes PD 60/2), wheels use
# velocity commands (servo 0.2) — "hardware_pd_vel".
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheeled_rl_controller:
      type: wheeled_rl/WheeledRLController

wheeled_rl_controller:
  ros__parameters:
    model_path: "policy/policy.onnx"   # 35D -> 6D, validated by check_onnx_contract.py
    # pipeline delays in 50 Hz policy steps (20 ms each); official training
    # always runs obs 20-80 ms / act 20-60 ms. 80/60 ms measured best for the
    # official 13k flat_and_rotation policy (see docs/timing.md).
    obs_delay_steps: 4   # 80 ms
    act_delay_steps: 3   # 60 ms

wheeled_mujoco_system:
  ros__parameters:
    mjcf_path: "models/wheelbipe_v14_gimbal_scene.xml"  # official closed-loop MJCF + floor

